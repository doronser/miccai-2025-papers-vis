[package]
name = "miccai-2025-papers-vis"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
config = { version = "0.14", default-features = false, features = ["toml", "yaml", "ini", "ron"] }
dotenvy = "0.15"

[lib]
name = "miccai_2025_papers_vis"
path = "src/lib.rs"
