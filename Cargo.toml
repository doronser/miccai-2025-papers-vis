[package]
name = "miccai-2025-papers-vis"
version = "0.1.0"
edition = "2021"
rust-version = "1.75.0"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
config = "0.11"
dotenvy = "0.15"
ndarray = "0.15"
# ndarray-npy 0.5 uses py_literal which depends on pest with rust 1.83 requirement
# We'll implement NPZ reading manually using zip crate
parking_lot = "0.12"
zip = "0.5"
anyhow = "1.0"
nom = "7.0"

[lib]
name = "miccai_2025_papers_vis"
path = "src/lib.rs"
