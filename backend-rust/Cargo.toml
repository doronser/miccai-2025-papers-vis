[workspace]
members = [
    "models",
    "services",
    "infrastructure",
    "api",
]
resolver = "2"

[workspace.dependencies]
# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Web framework
actix-web = "4.5"
actix-cors = "0.7"

# Async runtime
tokio = { version = "1.37", features = ["full"] }

# Numerical computing
ndarray = "0.15"
ndarray-stats = "0.5"
ndarray-npy = "0.8"

# Machine learning
linfa = "0.7"
linfa-reduction = "0.7"
linfa-clustering = "0.7"

# Utilities
zip = "0.6"
dashmap = "5.5"

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Logging
env_logger = "0.10"
log = "0.4"
